const COLOR={ref:'#2b6cb0',ai:'#03c75a'};
const map=L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);

const groups={},markers={},bounds={};
function build(key){
  const g=L.layerGroup(); markers[key]={}; bounds[key]=[];
  DATA[key].forEach(it=>{
    if(it.lat==null||it.lng==null)return;
    const sc = it.score!=null ? ' <span style="color:#e8590c;font-weight:700">'+it.score+'점</span>' : '';
    const nw = it.isNew ? ' <span style="background:#e8590c;color:#fff;font-size:10px;padding:1px 5px;border-radius:8px">NEW</span>' : '';
    const rz = it.reason ? '<br><span style="color:#2b8a3e">↳ '+it.reason+'</span>' : '';
    const ad = it.addr ? '<br><span style="color:#888">'+it.addr+'</span>' : '';
    const pop='<b>'+it.rank+'. '+it.type+'</b>'+sc+nw+'<br>보증금/월세 <b style="color:#e8590c">'+it.price+'</b> · '+it.area+' · '+it.floor+' · '+it.dir+ad+'<br><span style="color:#888">'+it.desc+'</span>'+rz
      +'<br><br><a class="nland" href="'+it.nland+'" target="_blank">▶ 네이버 부동산</a>'+(it.nmap?' &nbsp; <a href="'+it.nmap+'" target="_blank">▶ 지도</a>':'');
    const icon=L.divIcon({className:'',html:'<div class="num-pin" style="background:'+COLOR[key]+'">'+it.rank+'</div>',iconSize:[26,26],iconAnchor:[13,13]});
    const m=L.marker([it.lat,it.lng],{icon}).bindPopup(pop,{maxWidth:260});
    g.addLayer(m); markers[key][it.no]=m; bounds[key].push([it.lat,it.lng]);
  });
  groups[key]=g;
}
build('ref'); build('ai');

const list=document.getElementById('list');
function renderList(key){
  list.innerHTML='';
  DATA[key].forEach(it=>{
    const d=document.createElement('div');d.className='card';
    const sc = it.score!=null ? '<span class="sc">'+it.score+'점</span> ' : '';
    const nw = it.isNew ? '<span class="badge">NEW</span> ' : '';
    const rz = it.reason ? '<div class="rz">↳ '+it.reason+'</div>' : '';
    const ad = it.addr ? '<div class="ad">'+it.addr+'</div>' : '';
    d.innerHTML='<div class="top"><span class="n" style="background:'+COLOR[key]+'">'+it.rank+'</span>'+sc+nw+'<b>'+it.type+'</b> <span class="p">'+it.price+'</span></div>'
      +'<div class="a">'+it.area+' · '+it.floor+' · '+it.dir+'</div>'+ad+rz;
    d.onclick=()=>{ if(markers[key][it.no]){ map.setView([it.lat,it.lng],17); markers[key][it.no].openPopup(); } };
    list.appendChild(d);
  });
}

let cur=null;
function showTab(key){
  if(cur) map.removeLayer(groups[cur]);
  cur=key; map.addLayer(groups[key]);
  if(bounds[key].length) map.fitBounds(bounds[key],{padding:[40,40]}); else map.setView([37.51,126.86],11);
  renderList(key);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.k===key));
  setTimeout(()=>map.invalidateSize(),200);
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.k));
window.addEventListener('resize',()=>map.invalidateSize());
showTab('ref');  // 기본: 지수찾음
</script></body></html>
